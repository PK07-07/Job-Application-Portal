services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-instance-1
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-1
      - MONGO_URI=${MONGO_URI}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRE=${ACCESS_TOKEN_EXPIRE}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRE=${REFRESH_TOKEN_EXPIRE}
      - CLIENT_URL=${CLIENT_URL}
    restart: always

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-instance-2
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-2
      - MONGO_URI=${MONGO_URI}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRE=${ACCESS_TOKEN_EXPIRE}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRE=${REFRESH_TOKEN_EXPIRE}
      - CLIENT_URL=${CLIENT_URL}
    restart: always

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-instance-3
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-3
      - MONGO_URI=${MONGO_URI}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRE=${ACCESS_TOKEN_EXPIRE}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRE=${REFRESH_TOKEN_EXPIRE}
      - CLIENT_URL=${CLIENT_URL}
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: always
